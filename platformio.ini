; ============================================================
;  ESP32 Digital Walkie-Talkie - PlatformIO configuration
;  Board: ESP32-WROOM-32D (generic "esp32dev" board definition)
; ============================================================

[env:esp32dev]
platform = espressif32@6.7.0     ; Pinned so the ESP-NOW callback signatures stay stable (Arduino core 2.x)
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = COM3
build_flags =
    -Wall